site_name: AI4Econ
site_description: A practical online book about AI workflows for economics research
site_url: https://luzhiyu-econ.github.io/AI4Econ/
repo_url: https://github.com/luzhiyu-econ/AI4Econ
repo_name: luzhiyu-econ/AI4Econ
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
theme:
  name: material
  language: en
  font:
    text: Source Sans 3
    code: IBM Plex Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.path
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
extra_css:
  - assets/stylesheets/extra.css
nav:
  - Home: index.md
  - Start here:
      - How to use this book: start.md
  - The research workflow:
      - 1. Define the task: chapters/01-define-task.md
      - 2. Build an annotation protocol: chapters/02-annotation.md
      - 3. Evaluate the output: chapters/03-evaluation.md
      - 4. Use AI evidence in an economics paper: chapters/04-inference.md
  - About: about.md
